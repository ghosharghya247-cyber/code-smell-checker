version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codesmell
      POSTGRES_PASSWORD: codesmell
      POSTGRES_DB: codesmell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://codesmell:codesmell@postgres:5432/codesmell
      JWT_SECRET: dev-secret-key-change-in-production
      ENVIRONMENT: development
    depends_on:
      - postgres
    volumes:
      - .:/app

volumes:
  postgres_data:
